name: Aggiorna grafici

on:
  schedule:
    - cron: "30 17 * * 1-5"   # giorni feriali, dopo la chiusura dei mercati europei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance
      - run: python scripts/fetch_charts.py
      - name: Commit dati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/charts
          git diff --cached --quiet || git commit -m "Aggiorna grafici $(date +%F)"
          git push
